<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ROGUE CONTRACT</title>
  <meta name="description" content="ROGUE CONTRACT: a Dark Forces-style Star Wars fan shooter for the browser. Work in progress.">
  <meta name="theme-color" content="#000000">
  <!-- Link previews (Slack, Teams, chat apps). Previews need absolute URLs:
       change these if the game is hosted somewhere other than GitHub Pages. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ROGUE CONTRACT">
  <meta property="og:description" content="A mercenary on contract to the Rebellion. A Dark Forces-style fan shooter for the browser, in progress.">
  <meta property="og:url" content="https://mjvdw13.github.io/rogue-contract/">
  <meta property="og:image" content="https://mjvdw13.github.io/rogue-contract/docs/screenshots/title.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/ui/favicon.png">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main id="stage">
    <canvas id="screen" width="320" height="200" aria-label="Raccoon Alex game screen" tabindex="0"></canvas>
    <div id="boot-message" role="status">LOADING...</div>
  </main>
  <noscript><p class="noscript">RACCOON ALEX needs JavaScript to run.</p></noscript>
  <script>
    // ES modules don't load from file:// URLs, so explain how to run the game locally.
    if (location.protocol === 'file:') {
      document.getElementById('boot-message').innerHTML =
        'RACCOON ALEX must be served over HTTP.<br>Run <code>npx http-server</code> in the repo folder<br>and open the URL it prints.';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
